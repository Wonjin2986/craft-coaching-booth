'<dl>'+field('검토 기준',s.a.criterion)+field('수정할 내용 또는 유지할 이유',s.a.change)+field('결과물 파일명·위치',s.a.location)+'</dl>'+recordDetails('수정 요청문',s.revision)+recordDetails('수정본 본문',s.result)+'<div class="'+(s.reviewed?'notice':'warning')+'">'+(s.reviewed?'참여자가 실제 자료를 확인한 것으로 기록했습니다.':'추가 확인이 필요한 자료입니다. 검토 완료로 기록하지 않습니다.')+'</div>',
'<dl>'+field('수업 적용 계획',s.a.apply)+'</dl><p class="later-note">수업 후 이어 쓸 내용<br>관찰한 학생의 모습 · 자료가 도움 된 점 · 다음에 수정할 점<br><strong>지금은 적용 계획입니다. 실제 적용·성찰은 수업 후에 기록합니다.</strong></p>'
];
return CRAFT.map((x,i)=>'<section class="record-card"><div class="record-heading"><span class="stage-letter" aria-hidden="true">'+x.letter+'</span><h2>'+x.ko+'<small>'+x.en+'</small></h2></div>'+blocks[i]+'</section>').join('');
}
function record(){return '# CRAFT · 코칭 기반 AI 수업자료 제작 기록\n\n'
+'연구회: '+BOOTH.group+'\n작성: '+new Date().toLocaleString('ko-KR')+'\n체험 방식: '+(s.mode==='own'?'내 수업':s.mode==='demo'?'가상 사례로 시작':'가상 예시 초안으로 전환하여 검토')+'\n만들 자료: '+formatLabel()+'\n'
+'\n## C · Context | 필요 탐색\n\n### 수업 장면\n'+(s.a.scene||'미입력')+'\n\n### 대상과 주제\n'+(s.a.target||'미입력')+'\n'
+(s.original?'\n### 가상 예시 전환 전 내 답변\n장면: '+(s.original.scene||'미입력')+'\n대상: '+(s.original.target||'미입력')+'\n목표: '+(s.original.goal||'미입력')+'\n필요한 도움: '+(s.original.support||'미입력')+'\n':'')
+'\n## R · Requirements | 자료 설계\n\n### 학생에게 기대하는 행동\n'+(s.a.goal||'미입력')+'\n\n### 자료가 제공할 도움\n'+(s.a.support||'미입력')+'\n\n### 형식·디자인\n'+formatLabel()+' / '+(isSlides()||s.a.design==='blue'?'흰 배경·파란색 강조':'인쇄용 흑백')+'\n'
+'\n## A · AI creation | AI 제작\n\n### 제작 요청문\n'+s.prompt+'\n\n### 초안\n'+(s.draft||'별도 파일 사용 / 본문 미입력')+'\n'
+'\n## F · Feedback | 검토·보완\n\n### 처음 정한 목표\n'+(s.a.goal||'미입력')+'\n\n### 검토 기준\n'+(s.a.criterion||'미입력')+'\n\n### 수정 또는 유지 이유\n'+(s.a.change||'미입력')+'\n\n### 수정 요청문\n'+s.revision+'\n\n### 수정본\n'+(s.result||'별도 파일 사용 / 본문 미입력')+'\n\n결과물 위치: '+(s.a.location||'미입력')+'\n참여자의 실제 자료 확인: '+(s.reviewed?'확인함':'추가 확인 필요')+'\n'
+'\n## T · Transfer | 적용·성찰\n\n### 수업 적용 계획\n'+(s.a.apply||'미입력')+'\n\n### 수업 후 성찰 — 실제 적용 후 작성\n적용한 날짜와 수업: \n관찰한 학생의 모습: \n자료가 도움 된 점과 근거: \n다음 제작에서 유지하거나 수정할 점: \n\n부스에서는 적용 계획까지 작성했습니다. 실제 수업 적용과 효과를 확인한 기록은 아닙니다.\n\n---\nCRAFT는 연구회가 제안하는 자료 제작 과정을 기억하기 위한 이름입니다. 입력을 정리한 기록이며 AI가 내용의 정확성을 자동 검증한 결과가 아닙니다.\n';}

$('historyBtn').onclick=()=>{$('dialogBody').innerHTML='<h2>지금까지 남긴 이야기</h2><p class="quiet">답을 고치려면 닫고 ‘이전으로’를 이용하세요.</p>'+Object.entries(questions).filter(([k])=>s.a[k]).map(([k,q])=>`<div class="history-item"><small>${esc(q)}</small><p>${esc(s.a[k])}</p></div>`).join('')+(!Object.keys(s.a).length?'<p>아직 남긴 이야기가 없습니다.</p>':'');$('dialog').showModal()};
$('restartBtn').onclick=()=>ask('새 참여자 준비','기록과 결과물을 먼저 저장해 주세요. 이 화면의 입력을 지운 뒤 마이클에서 새 대화·새 문서를 준비합니다. 체험용 계정 로그인은 유지합니다.',()=>{try{sessionStorage.removeItem(K)}catch{}s=initial();go(0)});
